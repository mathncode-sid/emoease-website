<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post - Men's Mental Health Blog</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>💙 Men's Mental Health</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <article id="post-container" class="post-detail">
      <p class="loading">Loading post...</p>
    </article>
    <a href="/" class="btn btn-secondary">← Back to all posts</a>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Men's Mental Health Blog. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Get post ID from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    if (!postId) {
      document.getElementById('post-container').innerHTML = '<p class="error">No post ID provided</p>';
    } else {
      loadPost(postId);
    }

    async function loadPost(id) {
      try {
        const response = await fetch(`/api/posts/${id}`);
        
        if (!response.ok) {
          throw new Error('Post not found');
        }

        const post = await response.json();
        displayPost(post);
      } catch (error) {
        document.getElementById('post-container').innerHTML = 
          `<p class="error">Error loading post: ${error.message}</p>`;
      }
    }

    function displayPost(post) {
      const container = document.getElementById('post-container');
      const date = new Date(post.createdAt).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      container.innerHTML = `
        <h1>${escapeHtml(post.title)}</h1>
        <div class="post-meta">
          <span class="author">By ${escapeHtml(post.author)}</span>
          <span class="date">${date}</span>
        </div>
        <div class="post-content">${escapeHtml(post.content).replace(/\n/g, '<br>')}</div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
