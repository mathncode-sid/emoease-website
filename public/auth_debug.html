<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debug - EmoEase</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; background: #4a7ba7; color: white; border: none; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Authentication Debug</h1>
    
    <div class="debug-section">
        <h2>Check Current Auth State</h2>
        <button onclick="checkAuthState()">Check Auth State</button>
        <button onclick="clearAllAuth()">Clear All Auth</button>
        <div id="auth-state" class="result"></div>
    </div>

    <div class="debug-section">
        <h2>Quick Test Login</h2>
        <button onclick="quickLogin()">Login as test@example.com</button>
        <div id="login-result" class="result"></div>
    </div>

    <script>
        function checkAuthState() {
            const authToken = localStorage.getItem('authToken');
            const userToken = localStorage.getItem('userToken');
            const userData = localStorage.getItem('userData');
            const adminEmail = localStorage.getItem('adminEmail');
            
            const state = {
                authToken: authToken ? authToken.substring(0, 20) + '...' : null,
                userToken: userToken ? userToken.substring(0, 20) + '...' : null,
                userData: userData ? JSON.parse(userData) : null,
                adminEmail: adminEmail,
                currentPage: window.location.pathname
            };
            
            document.getElementById('auth-state').textContent = JSON.stringify(state, null, 2);
        }
        
        function clearAllAuth() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userToken');
            localStorage.removeItem('userData');
            localStorage.removeItem('adminEmail');
            document.getElementById('auth-state').textContent = 'All auth data cleared';
        }
        
        async function quickLogin() {
            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: 'test@example.com', 
                        password: 'password123' 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userData', JSON.stringify(data.user));
                    document.getElementById('login-result').textContent = 'Login successful!\n' + JSON.stringify(data.user, null, 2);
                } else {
                    document.getElementById('login-result').textContent = 'Login failed: ' + data.error;
                }
            } catch (error) {
                document.getElementById('login-result').textContent = 'Error: ' + error.message;
            }
        }
        
        // Auto-check on load
        checkAuthState();
    </script>
</body>
</html>
