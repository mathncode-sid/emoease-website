<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Men's Mental Health Blog</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>💙 Admin Panel</h1>
      <nav>
        <a href="/">Home</a>
        <a href="#" id="logout-btn" style="display: none;">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Login/Register Section -->
    <section id="auth-section" class="auth-section">
      <div class="auth-container">
        <!-- Login Form -->
        <div class="auth-form" id="login-form">
          <h2>Login</h2>
          <form id="login">
            <div class="form-group">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
            <p class="form-switch">Don't have an account? <a href="#" id="show-register">Register</a></p>
          </form>
        </div>

        <!-- Register Form -->
        <div class="auth-form" id="register-form" style="display: none;">
          <h2>Register</h2>
          <form id="register">
            <div class="form-group">
              <label for="register-email">Email</label>
              <input type="email" id="register-email" required>
            </div>
            <div class="form-group">
              <label for="register-password">Password (min 6 characters)</label>
              <input type="password" id="register-password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
            <p class="form-switch">Already have an account? <a href="#" id="show-login">Login</a></p>
          </form>
        </div>
      </div>
      <div id="auth-message" class="message"></div>
    </section>

    <!-- Admin Dashboard (hidden until logged in) -->
    <section id="admin-dashboard" style="display: none;">
      <h2>Manage Posts</h2>
      
      <!-- Create/Edit Post Form -->
      <div class="post-form-container">
        <h3 id="form-title">Create New Post</h3>
        <form id="post-form">
          <input type="hidden" id="post-id">
          <div class="form-group">
            <label for="post-title">Title</label>
            <input type="text" id="post-title" required>
          </div>
          <div class="form-group">
            <label for="post-author">Author</label>
            <input type="text" id="post-author" required>
          </div>
          <div class="form-group">
            <label for="post-content">Content</label>
            <textarea id="post-content" rows="10" required></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">Create Post</button>
            <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Cancel</button>
          </div>
        </form>
      </div>

      <div id="post-message" class="message"></div>

      <!-- Posts List -->
      <div class="admin-posts-list">
        <h3>All Posts</h3>
        <div id="admin-posts-container">
          <p class="loading">Loading posts...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
