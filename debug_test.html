<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test</title>
</head>
<body>
    <h1>Debug Test</h1>
    <button id="test-storage">Test LocalStorage</button>
    <button id="test-user-login">Test User Login</button>
    <button id="clear-storage">Clear Storage</button>
    
    <div id="results"></div>

    <script>
        document.getElementById('test-storage').addEventListener('click', function() {
            // Test basic localStorage
            localStorage.setItem('test', 'working');
            const result = localStorage.getItem('test');
            document.getElementById('results').innerHTML = `<p>LocalStorage test: ${result}</p>`;
        });

        document.getElementById('test-user-login').addEventListener('click', function() {
            // Check what's in localStorage
            const userData = localStorage.getItem('userData');
            const registeredUsers = localStorage.getItem('registeredUsers');
            const userPosts = localStorage.getItem('userPosts_test@example.com');
            
            document.getElementById('results').innerHTML = `
                <h3>Storage Contents:</h3>
                <p><strong>userData:</strong> ${userData}</p>
                <p><strong>registeredUsers:</strong> ${registeredUsers}</p>
                <p><strong>userPosts:</strong> ${userPosts}</p>
            `;
        });

        document.getElementById('clear-storage').addEventListener('click', function() {
            localStorage.clear();
            document.getElementById('results').innerHTML = `<p>Storage cleared</p>`;
        });
    </script>
</body>
</html>
