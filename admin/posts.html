<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Posts - EmoEase Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="dashboard.html" class="logo">EmoEase Admin</a>
                <nav>
                    <ul class="nav-links">
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="posts.html" class="active">Blog Posts</a></li>
                        <li><a href="#" onclick="logout()">Logout</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="flex justify-between items-center mb-lg">
                <div>
                    <h1 class="page-title">Blog Posts</h1>
                    <p class="page-subtitle">Manage your blog content</p>
                </div>
                <button onclick="showCreateForm()" class="btn btn-primary">Create New Post</button>
            </div>

            <div id="alert-container"></div>

            <!-- Create/Edit Post Form -->
            <div id="postForm" class="card hidden">
                <div class="card-header">
                    <h3 class="card-title" id="formTitle">Create New Post</h3>
                    <button onclick="hidePostForm()" class="btn btn-secondary btn-sm">Cancel</button>
                </div>

                <form id="postFormElement">
                    <input type="hidden" id="postId" name="postId">
                    
                    <div class="form-group">
                        <label for="title" class="form-label">Post Title</label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            class="form-input" 
                            required
                            placeholder="Enter post title"
                        >
                    </div>

                    <div class="form-group">
                        <label for="content" class="form-label">Post Content</label>
                        <textarea 
                            id="content" 
                            name="content" 
                            class="form-textarea" 
                            required
                            placeholder="Write your post content here..."
                            style="min-height: 200px;"
                        ></textarea>
                    </div>

                    <div class="flex gap-md">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span id="submitBtnText">Create Post</span>
                            <span id="submitBtnLoading" class="loading hidden"></span>
                        </button>
                        <button type="button" onclick="hidePostForm()" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Posts List -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">All Posts</h3>
                </div>
                
                <div id="postsContainer">
                    <div class="loading" style="margin: var(--spacing-lg) auto;"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        let currentEditId = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            requireAuth();

            // Load posts
            loadPosts();

            // Setup form handler
            document.getElementById('postFormElement').addEventListener('submit', handlePostSubmit);

            // Check URL parameters for actions
            const urlParams = new URLSearchParams(window.location.search);
            const action = urlParams.get('action');
            const id = urlParams.get('id');

            if (action === 'create') {
                showCreateForm();
            } else if (action === 'edit' && id) {
                editPost(parseInt(id));
            }
        });

        async function loadPosts() {
            try {
                const response = await fetch('/api/posts');
                const result = await response.json();

                if (result.success) {
                    displayPosts(result.data.posts);
                } else {
                    showAlert('Error loading posts', 'error');
                }
            } catch (error) {
                console.error('Load posts error:', error);
                showAlert('Error loading posts', 'error');
            }
        }

        function displayPosts(posts) {
            const container = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                container.innerHTML = '<p style="color: var(--color-text-secondary); text-align: center; padding: var(--spacing-lg);">No posts yet. Create your first post!</p>';
                return;
            }

            const postsHTML = `
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Created</th>
                                <th>Updated</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${posts.map(post => `
                                <tr>
                                    <td>
                                        <div style="font-weight: 600;">${escapeHtml(post.title)}</div>
                                        <div style="color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: var(--spacing-xs);">
                                            ${escapeHtml(post.content.substring(0, 100))}${post.content.length > 100 ? '...' : ''}
                                        </div>
                                    </td>
                                    <td>${escapeHtml(post.author)}</td>
                                    <td>${formatDate(post.created_at)}</td>
                                    <td>${formatDate(post.updated_at)}</td>
                                    <td>
                                        <div class="flex gap-sm">
                                            <button onclick="editPost(${post.id})" class="btn btn-secondary btn-sm">Edit</button>
                                            <button onclick="deletePost(${post.id})" class="btn btn-danger btn-sm">Delete</button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = postsHTML;
        }

        function showCreateForm() {
            currentEditId = null;
            document.getElementById('formTitle').textContent = 'Create New Post';
            document.getElementById('submitBtnText').textContent = 'Create Post';
            document.getElementById('postFormElement').reset();
            document.getElementById('postId').value = '';
            document.getElementById('postForm').classList.remove('hidden');
            document.getElementById('title').focus();
        }

        function hidePostForm() {
            document.getElementById('postForm').classList.add('hidden');
            currentEditId = null;
            // Update URL to remove action parameters
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        async function editPost(id) {
            try {
                const response = await fetch(`/api/posts/${id}`);
                const result = await response.json();

                if (result.success) {
                    const post = result.data.post;
                    currentEditId = id;
                    
                    document.getElementById('formTitle').textContent = 'Edit Post';
                    document.getElementById('submitBtnText').textContent = 'Update Post';
                    document.getElementById('postId').value = id;
                    document.getElementById('title').value = post.title;
                    document.getElementById('content').value = post.content;
                    document.getElementById('postForm').classList.remove('hidden');
                    document.getElementById('title').focus();
                } else {
                    showAlert('Error loading post for editing', 'error');
                }
            } catch (error) {
                console.error('Edit post error:', error);
                showAlert('Error loading post for editing', 'error');
            }
        }

        async function handlePostSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            const submitBtnLoading = document.getElementById('submitBtnLoading');
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtnText.classList.add('hidden');
            submitBtnLoading.classList.remove('hidden');
            
            const formData = new FormData(e.target);
            const postData = {
                title: formData.get('title'),
                content: formData.get('content')
            };
            
            try {
                let response;
                if (currentEditId) {
                    // Update existing post
                    response = await authenticatedFetch(`/api/posts/${currentEditId}`, {
                        method: 'PUT',
                        body: JSON.stringify(postData)
                    });
                } else {
                    // Create new post
                    response = await authenticatedFetch('/api/posts', {
                        method: 'POST',
                        body: JSON.stringify(postData)
                    });
                }
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert(currentEditId ? 'Post updated successfully!' : 'Post created successfully!', 'success');
                    hidePostForm();
                    loadPosts(); // Reload posts list
                } else {
                    showAlert(result.message || 'Error saving post', 'error');
                }
            } catch (error) {
                console.error('Post submit error:', error);
                showAlert('Error saving post', 'error');
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtnText.classList.remove('hidden');
                submitBtnLoading.classList.add('hidden');
            }
        }

        async function deletePost(id) {
            if (!confirm('Are you sure you want to delete this post? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await authenticatedFetch(`/api/posts/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('Post deleted successfully!', 'success');
                    loadPosts(); // Reload posts list
                } else {
                    showAlert(result.message || 'Error deleting post', 'error');
                }
            } catch (error) {
                console.error('Delete post error:', error);
                showAlert('Error deleting post', 'error');
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            alertContainer.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            
            // Auto-hide success messages
            if (type === 'success') {
                setTimeout(() => {
                    alertContainer.innerHTML = '';
                }, 5000);
            }
        }
    </script>
</body>
</html>
