<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #4a7ba7; color: white; border: none; cursor: pointer; }
        .message { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Simple Form Test</h1>
    
    <div>
        <h3>Set User Data</h3>
        <button onclick="setTestUser()">Set Test User as Logged In</button>
        <button onclick="clearData()">Clear All Data</button>
        <button onclick="showData()">Show Storage Data</button>
    </div>
    
    <div id="data-display"></div>
    
    <form id="test-form">
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" required>
        </div>
        <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" required>
                <option value="">Select...</option>
                <option value="personal-story">Personal Story</option>
                <option value="tips-advice">Tips & Advice</option>
            </select>
        </div>
        <div class="form-group">
            <label for="content">Content:</label>
            <textarea id="content" rows="5" required></textarea>
        </div>
        <button type="submit">Submit Test Post</button>
    </form>
    
    <div id="message"></div>
    <div id="posts-display"></div>

    <script>
        // Set up test user
        function setTestUser() {
            const testUser = {
                id: 1,
                name: 'Test User',
                email: 'test@example.com',
                role: 'user'
            };
            localStorage.setItem('userData', JSON.stringify(testUser));
            showMessage('Test user set!', 'success');
            showData();
        }
        
        function clearData() {
            localStorage.clear();
            showMessage('All data cleared!', 'success');
            showData();
        }
        
        function showData() {
            const userData = localStorage.getItem('userData');
            const userPosts = localStorage.getItem('userPosts_test@example.com');
            
            document.getElementById('data-display').innerHTML = `
                <h3>Storage Data:</h3>
                <p><strong>User Data:</strong> ${userData || 'None'}</p>
                <p><strong>User Posts:</strong> ${userPosts || 'None'}</p>
            `;
        }
        
        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            messageEl.className = `message ${type}`;
            messageEl.textContent = message;
        }
        
        // Form submission
        document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('Form submitted!');
            
            const userData = localStorage.getItem('userData');
            if (!userData) {
                showMessage('No user logged in!', 'error');
                return;
            }
            
            const user = JSON.parse(userData);
            console.log('Current user:', user);
            
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const content = document.getElementById('content').value;
            
            console.log('Form data:', { title, category, content });
            
            if (!title || !category || !content) {
                showMessage('Please fill all fields!', 'error');
                return;
            }
            
            // Create post
            const post = {
                id: Date.now(),
                title: title.trim(),
                category: category,
                content: content.trim(),
                author: user.name || user.email,
                authorId: user.id || user.email,
                status: 'pending',
                createdAt: new Date().toISOString()
            };
            
            console.log('Created post:', post);
            
            // Save to localStorage
            const existingPosts = JSON.parse(localStorage.getItem('userPosts_' + user.email) || '[]');
            existingPosts.unshift(post);
            localStorage.setItem('userPosts_' + user.email, JSON.stringify(existingPosts));
            
            console.log('Saved posts:', existingPosts);
            
            showMessage('Post submitted successfully!', 'success');
            this.reset();
            showData();
            displayPosts();
        });
        
        function displayPosts() {
            const userData = localStorage.getItem('userData');
            if (!userData) return;
            
            const user = JSON.parse(userData);
            const posts = JSON.parse(localStorage.getItem('userPosts_' + user.email) || '[]');
            
            let html = '<h3>User Posts:</h3>';
            posts.forEach(post => {
                html += `<div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                    <h4>${post.title}</h4>
                    <p><strong>Category:</strong> ${post.category}</p>
                    <p><strong>Status:</strong> ${post.status}</p>
                    <p>${post.content.substring(0, 100)}...</p>
                </div>`;
            });
            
            document.getElementById('posts-display').innerHTML = html;
        }
        
        // Initial data display
        showData();
    </script>
</body>
</html>
