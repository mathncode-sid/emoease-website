<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Men's Mental Health</title>
    <meta name="description" content="Read articles, stories, and insights about men's mental health, wellness, and breaking stigma.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">EmoEase</a>
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="blog.html" class="active">Blog</a></li>
                        <li><a href="index.html#about">About</a></li>
                        <li><a href="index.html#resources">Resources</a></li>
                        <li><a href="index.html#contact">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="text-center mb-xl">
                <h1 class="section-title">Our Blog</h1>
                <p class="section-subtitle">
                    Stories, insights, and resources to support your mental health journey
                </p>
            </div>

            <div id="blogPosts" class="posts-grid">
                <div class="loading" style="margin: var(--spacing-lg) auto;"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <h3 class="footer-title">Men's Mental Health</h3>
                <p>Breaking the silence, building support, creating change.</p>
                <p style="margin-top: var(--spacing-md); font-size: var(--font-size-sm);">
                    &copy; 2025 EmoEase. All rights reserved. Built and maintained by mathncode-sid.
                </p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadBlogPosts();
        });

        async function loadBlogPosts() {
            try {
                const response = await fetch('/api/posts');
                const result = await response.json();

                if (result.success) {
                    displayBlogPosts(result.data.posts);
                } else {
                    document.getElementById('blogPosts').innerHTML = 
                        '<p style="color: var(--color-text-secondary); text-align: center;">No articles available yet.</p>';
                }
            } catch (error) {
                console.error('Load posts error:', error);
                document.getElementById('blogPosts').innerHTML = 
                    '<p style="color: var(--color-text-secondary); text-align: center;">Error loading articles.</p>';
            }
        }

        function displayBlogPosts(posts) {
            const container = document.getElementById('blogPosts');
            
            if (posts.length === 0) {
                container.innerHTML = '<p style="color: var(--color-text-secondary); text-align: center;">No articles available yet.</p>';
                return;
            }

            const postsHTML = posts.map(post => `
                <article class="card">
                    <h2 class="card-title">
                        <a href="post.html?id=${post.id}" style="color: inherit; text-decoration: none;">
                            ${escapeHtml(post.title)}
                        </a>
                    </h2>
                    <div class="card-meta">
                        By ${escapeHtml(post.author)} • ${formatDate(post.created_at)}
                    </div>
                    <div class="card-content">
                        <p>${escapeHtml(post.content.substring(0, 250))}${post.content.length > 250 ? '...' : ''}</p>
                        <a href="post.html?id=${post.id}" class="btn btn-primary" style="margin-top: var(--spacing-md);">
                            Read Full Article
                        </a>
                    </div>
                </article>
            `).join('');

            container.innerHTML = postsHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
